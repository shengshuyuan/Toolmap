<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="350" viewBox="0 0 1140 350" role="img" aria-labelledby="title desc"><title id="title">Toolmap · 日常文件与文本小工具</title><desc id="desc">把零散工具集中到一个页面，文本和文件由浏览器本地处理。。功能流程示意，非界面截图。</desc><rect width="1140" height="350" rx="20" fill="#faf9f6"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243c43"><text x="42" y="58" font-size="29" font-weight="700">Toolmap · 日常文件与文本小工具</text><text x="42" y="96" font-size="17" fill="#52616b">把零散工具集中到一个页面，文本和文件由浏览器本地处理。</text><rect x="42" y="154" width="316" height="122" rx="18" fill="#e9f0ef"/><text x="64" y="190" font-size="16" fill="#52616b">01</text><text x="64" y="223" font-size="23" font-weight="600">选择工具</text><text x="64" y="253" font-size="15" fill="#52616b">文本、图片、二维码、MD、PDF</text><path d="M 369 215 h 18 m -6 -6 l 6 6 -6 6" stroke="#7c8b91" stroke-width="2" fill="none"/><rect x="402" y="154" width="316" height="122" rx="18" fill="#f4ecdf"/><text x="424" y="190" font-size="16" fill="#52616b">02</text><text x="424" y="223" font-size="23" font-weight="600">本地处理</text><text x="424" y="253" font-size="15" fill="#52616b">比较、压缩、编辑与整理</text><path d="M 729 215 h 18 m -6 -6 l 6 6 -6 6" stroke="#7c8b91" stroke-width="2" fill="none"/><rect x="762" y="154" width="316" height="122" rx="18" fill="#e9edf5"/><text x="784" y="190" font-size="16" fill="#52616b">03</text><text x="784" y="223" font-size="23" font-weight="600">带走结果</text><text x="784" y="253" font-size="15" fill="#52616b">复制或下载，按需保存历史</text><text x="42" y="316" font-size="14" fill="#52616b">功能流程示意，非界面截图 · 纯静态工具箱 / 本地历史</text></g></svg>