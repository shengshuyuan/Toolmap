name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # typecheck 最快，放最前面尽早失败
      - name: Type check
        run: npm run typecheck

      # npm test 的 pretest 会先执行完整生产构建校验（verify:build）
      - name: Run tests
        run: npm test
