<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Toolmap - 产品经理的本地工作台</title>
    <meta name="description" content="Toolmap：面向产品经理的本地工作台，支持文本比对、字符统计、Markdown 创作、图片压缩、二维码设计与 PDF 工具，全程在浏览器本地完成。" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://toolmap.shuyuan.me/" />
    <meta property="og:title" content="Toolmap - 产品经理的本地工作台" />
    <meta property="og:description" content="面向产品经理的本地工作台：文本比对、字符统计、Markdown 创作、图片压缩、二维码设计与 PDF 工具，全程在浏览器本地完成。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toolmap.shuyuan.me/" />
    <meta property="og:image" content="https://toolmap.shuyuan.me/assets/og-image.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./assets/app.css" data-app-style />
    <link rel="stylesheet" href="./src/tools/text-diff/text-diff.css" />
    <link rel="stylesheet" href="./src/tools/image-compress/image-compress.css" />
    <link rel="stylesheet" href="./src/tools/char-count/char-count.css" />
    <link rel="stylesheet" href="./src/tools/qrcode/qrcode.css" />
    <link rel="stylesheet" href="./src/tools/markdown-editor/markdown-editor.css" />
    <link rel="stylesheet" href="./src/tools/pdf-tools/pdf-tools.css" />
    <script>
      (function () {
        try {
          if (location.protocol === "file:") {
            document.documentElement.classList.add("is-file-protocol");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <!-- 移动端侧栏遮罩 -->
      <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

      <!-- 固定侧栏 (216px) -->
      <aside class="sidebar" id="siteSidebar" aria-label="侧栏导航">
        <div class="sidebar__brand">
          <div class="sidebar__logo-mark">T</div>
          <span class="sidebar__brand-name">Toolmap</span>
          <span class="sidebar__version">本地版</span>
          <button type="button" class="sidebar__close-mobile" id="btnCloseSidebar" aria-label="关闭菜单">✕</button>
        </div>

        <button class="sidebar__search-btn" id="sidebarSearchBtn" type="button">
          <div class="sidebar__search-left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>搜索工具</span>
          </div>
          <kbd class="sidebar__search-kbd">⌘K</kbd>
        </button>

        <nav id="toolSwitch" class="sidebar-nav" aria-label="工具切换"></nav>

        <div class="sidebar__footer">
          <div class="sidebar__safe-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>本地处理</span>
          </div>
          <button type="button" class="sidebar__manage-btn" id="sidebarDataManageBtn" data-nav-target="data-manage" title="本地数据管理" aria-label="本地数据管理">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </aside>

      <!-- 主舞台区 -->
      <div class="app-main">
        <!-- 移动端顶栏 -->
        <header class="mobile-topbar">
          <button type="button" class="mobile-menu-btn" id="btnMobileMenu" aria-label="打开菜单">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="mobile-topbar__brand">Toolmap</div>
          <div style="width: 22px;"></div>
        </header>

        <main class="main-stage">
          <div class="file-warning" role="alert" aria-live="polite">
            检测到你正在用 <code>file://</code> 直接打开本页面。由于浏览器安全策略，模块脚本会被拦截，导致按钮无响应。
            请在该目录运行：<code>python3 -m http.server 5173</code>，然后访问 <code>http://localhost:5173</code>。
          </div>

          <div id="toolMounts"></div>
        </main>

        <footer class="app-footer">
          <div class="footer__left">© <span id="year"></span> <a href="https://github.com/shengshuyuan/Toolmap" target="_blank" rel="noopener">树园</a></div>
          <div class="footer__right"><span id="appVersionLabel"></span> · 本地运行 · 仅保存在当前浏览器</div>
        </footer>
      </div>
    </div>

    <script type="module">
      import { APP_VERSION } from "./src/config/app-meta.js";

      const VERSION_KEY = "toolmap-seen-version";
      const prevVersion = localStorage.getItem(VERSION_KEY);
      if (prevVersion !== APP_VERSION) {
        localStorage.setItem(VERSION_KEY, APP_VERSION);
      }

      const style = document.querySelector("[data-app-style]");
      if (style) style.href = `./assets/app.css?v=${APP_VERSION}`;

      await import(`./src/app.js?v=${APP_VERSION}`);
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => reg.update())
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
